# Infrastructure pipeline (GitOps for infra):
#   Pull request touching infra/  -> terraform plan for staging + prod, posted as a PR comment
#   Merge to main                 -> apply staging automatically, then prod after manual approval
name: Terraform

on:
  pull_request:
    paths: ["infra/terraform/**"]
  push:
    branches: [main]
    paths: ["infra/terraform/**"]
  workflow_dispatch:

permissions:
  id-token: write      # required for GitHub OIDC -> AWS
  contents: read
  pull-requests: write # to comment the plan on the PR

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false # never cancel a running apply

env:
  TF_VERSION: 1.10.5
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    name: Plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [staging, prod]
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init
        run: terraform init -input=false -backend-config=envs/${{ matrix.env }}.backend.hcl
      - name: Plan
        id: plan
        run: |
          terraform plan -input=false -no-color -lock=false \
            -var-file=envs/${{ matrix.env }}.tfvars -out=tfplan
          terraform show -no-color tfplan > plan.txt
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('infra/terraform/plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated)';
            const summary = (plan.match(/Plan: .*|No changes\..*/) || ['(see details)'])[0];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Terraform plan — \`${{ matrix.env }}\`\n**${summary}**\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`
            });

  apply-staging:
    if: github.event_name != 'pull_request'
    name: Apply staging
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -input=false -backend-config=envs/staging.backend.hcl
      - run: terraform apply -input=false -auto-approve -var-file=envs/staging.tfvars

  apply-prod:
    needs: apply-staging
    name: Apply prod (requires approval)
    runs-on: ubuntu-latest
    environment: production # "Required reviewers" on this environment = manual gate
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -input=false -backend-config=envs/prod.backend.hcl
      - run: terraform apply -input=false -auto-approve -var-file=envs/prod.tfvars
