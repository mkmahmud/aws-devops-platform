# Continuous Delivery for the application:
#   build ONE pair of images per commit (tagged with the git SHA)
#   -> deploy to staging -> smoke test
#   -> wait for manual approval -> deploy the SAME images to production
name: Deploy

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "scripts/deploy.sh", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Redeploy an existing image tag (git SHA). Leave empty to build the current commit."
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${{ inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4
        if: ${{ !inputs.image_tag }}

      - name: Build & push backend
        if: ${{ !inputs.image_tag }}
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          platforms: linux/amd64
          tags: ${{ vars.ECR_REGISTRY }}/${{ vars.PROJECT }}/backend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        if: ${{ !inputs.image_tag }}
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          platforms: linux/amd64
          tags: ${{ vars.ECR_REGISTRY }}/${{ vars.PROJECT }}/frontend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  staging:
    needs: build
    uses: ./.github/workflows/_deploy-env.yml
    with:
      github_environment: staging
      tf_environment: staging
      image_tag: ${{ needs.build.outputs.image_tag }}

  production:
    needs: [build, staging]
    uses: ./.github/workflows/_deploy-env.yml
    with:
      github_environment: production # has "Required reviewers" -> pauses for approval
      tf_environment: prod
      image_tag: ${{ needs.build.outputs.image_tag }}
